<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>edit.gtfs.zone - GTFS Transit Data Editor</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="icons/favicon-512x512.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>

  <body class="font-sans h-screen overflow-hidden">
    <!-- App Container -->
    <div class="app-container h-screen grid grid-rows-[auto_1fr]">
      <!-- Header - DaisyUI Navbar -->
      <div class="navbar bg-base-100 col-span-2 border-b border-base-300">
        <div class="navbar-start">
          <a
            href="https://gtfs.zone"
            class="flex items-center gap-4"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="avatar">
              <div class="w-8 rounded-lg">
                <img src="logo.svg" alt="edit.gtfs.zone logo" />
              </div>
            </div>
            <div class="flex flex-col hidden md:flex">
              <h1 class="text-xl font-bold">
                <span class="text-primary">edit</span>.gtfs.zone<sup
                  id="app-version"
                  class="text-xs opacity-50 font-normal ml-1"
                ></sup>
              </h1>
            </div>
          </a>
        </div>

        <div class="navbar-end">
          <div class="flex items-center gap-2">
            <!-- Shapes Button -->
            <div class="indicator hidden md:inline-flex">
              <span
                id="shapes-count-badge"
                class="indicator-item badge badge-xs badge-primary hidden"
              ></span>
              <button
                id="shapes-btn"
                class="btn btn-ghost btn-sm btn-square"
                title="Shapes"
              >
                <!-- Icon injected from src/index.ts via renderRouteWaypointsIcon -->
              </button>
            </div>
            <!-- Calendar Button -->
            <div class="indicator hidden md:inline-flex">
              <span
                id="calendar-count-badge"
                class="indicator-item badge badge-xs badge-primary hidden"
              ></span>
              <button
                id="calendar-btn"
                class="btn btn-ghost btn-sm btn-square"
                title="Service Calendar"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"
                  />
                </svg>
              </button>
            </div>
            <!-- Fares Button -->
            <div class="indicator hidden md:inline-flex">
              <span
                id="fares-count-badge"
                class="indicator-item badge badge-xs badge-primary hidden"
              ></span>
              <button
                id="fares-btn"
                class="btn btn-ghost btn-sm btn-square"
                title="Fares (V2)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375Z"
                  />
                </svg>
              </button>
            </div>
            <!-- Levels Button -->
            <div class="indicator hidden md:inline-flex">
              <span
                id="levels-count-badge"
                class="indicator-item badge badge-xs badge-primary hidden"
              ></span>
              <button
                id="levels-btn"
                class="btn btn-ghost btn-sm btn-square"
                title="Manage Levels"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 17h4v3H3v-3Zm0-6h8v3H3v-3Zm0-6h12v3H3V5Z"
                  />
                </svg>
              </button>
            </div>

            <!-- Files Button -->
            <button
              id="files-btn"
              class="btn btn-ghost btn-sm btn-square hidden md:flex"
              title="Files"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"
                />
              </svg>
            </button>

            <!-- Theme Toggle -->
            <label class="swap swap-rotate">
              <!-- this hidden checkbox controls the state -->
              <input type="checkbox" class="theme-controller" value="light" />

              <!-- sun icon -->
              <svg
                class="swap-on h-6 w-6 fill-current"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"
                />
              </svg>

              <!-- moon icon -->
              <svg
                class="swap-off h-6 w-6 fill-current"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <path
                  d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"
                />
              </svg>
            </label>

            <!-- About / Help -->
            <button
              id="about-btn"
              class="btn btn-ghost btn-sm btn-square"
              title="About / Help (F1)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </button>

            <!-- Undo / History / Redo -->
            <div class="flex items-center gap-1">
              <div
                class="tooltip tooltip-bottom"
                id="undo-tooltip"
                data-tip="Nothing to undo"
              >
                <button
                  id="undo-btn"
                  class="btn btn-ghost btn-sm btn-square"
                  onclick="window.gtfsEditor?.undoEdit()"
                  disabled
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3 10h10a5 5 0 0 1 0 10H9M3 10l4-4M3 10l4 4"
                    />
                  </svg>
                </button>
              </div>
              <div class="indicator hidden md:inline-flex">
                <span
                  id="history-count-badge"
                  class="indicator-item badge badge-xs badge-primary hidden"
                ></span>
                <button
                  id="history-btn"
                  class="btn btn-ghost btn-sm btn-square"
                  title="History"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                    />
                  </svg>
                </button>
              </div>
              <div
                class="tooltip tooltip-bottom"
                id="redo-tooltip"
                data-tip="Nothing to redo"
              >
                <button
                  id="redo-btn"
                  class="btn btn-ghost btn-sm btn-square"
                  onclick="window.gtfsEditor?.redoEdit()"
                  disabled
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M21 10H11a5 5 0 0 0 0 10h4M21 10l-4-4M21 10l-4 4"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Load Dropdown -->
            <div class="dropdown dropdown-end">
              <div
                tabindex="0"
                role="button"
                class="btn btn-primary btn-sm"
                id="load-btn"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                  />
                </svg>
                <span class="hidden md:inline">Load</span>
              </div>
              <ul
                id="load-dropdown"
                tabindex="0"
                class="dropdown-content z-[50] menu p-2 shadow bg-base-100 rounded-box w-52"
              >
                <li>
                  <a id="empty-btn" class="flex items-center gap-2">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-4 w-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 6v6m0 0v6m0-6h6m-6 0H6"
                      />
                    </svg>
                    New Empty Feed
                  </a>
                </li>
                <li>
                  <details>
                    <summary class="flex items-center gap-2">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                        />
                      </svg>
                      Examples
                    </summary>
                    <ul class="p-2">
                      <li>
                        <a
                          id="example-columbia"
                          data-url="https://raw.githubusercontent.com/maxtkc/columbia-county-gtfs/refs/heads/main/columbia_county_gtfs.zip"
                        >
                          Columbia County
                        </a>
                      </li>
                      <li>
                        <a
                          id="example-west"
                          data-url="https://westbusservice.com/west_gtfs.zip"
                        >
                          West Bus Service
                        </a>
                      </li>
                    </ul>
                  </details>
                </li>
                <li>
                  <a id="upload-btn" class="flex items-center gap-2">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-4 w-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                      />
                    </svg>
                    Upload GTFS
                  </a>
                </li>
                <li>
                  <a id="from-url-btn" class="flex items-center gap-2">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-4 w-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
                      />
                    </svg>
                    From URL
                  </a>
                </li>
                <li>
                  <a id="atlas-search-btn" class="flex items-center gap-2">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-4 w-4"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                      />
                    </svg>
                    From TransitLand Atlas
                  </a>
                </li>
              </ul>
            </div>

            <!-- Export Button -->
            <button id="export-btn" class="btn btn-outline btn-sm" disabled>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"
                />
              </svg>
              <span class="hidden md:inline">Export</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Map Container -->
      <div class="relative bg-base-300">
        <div id="map" class="w-full h-full"></div>

        <!-- Map Controls -->
        <div
          id="map-controls"
          class="absolute top-2 left-2 right-2 z-40 flex flex-row items-start gap-2"
        >
          <!-- Search -->
          <div
            id="map-search-card"
            class="relative flex-1 max-w-sm card card-bordered bg-base-100 shadow-lg p-2"
          >
            <input
              type="text"
              id="map-search"
              placeholder="Search"
              class="input input-sm w-full"
            />
          </div>

          <!-- Map Tools -->
          <div
            class="card card-bordered bg-base-100 shadow-lg p-1 flex-shrink-0"
          >
            <div class="join">
              <button
                id="pointer-btn"
                class="btn btn-sm btn-square join-item btn-primary tooltip"
                data-tip="Pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 2l12 10-6 1-3 6L6 2z"
                  />
                </svg>
              </button>
              <button
                id="add-stop-btn"
                class="btn btn-sm btn-square join-item tooltip"
                data-tip="Add stop"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 6v6m0 0v6m0-6h6m-6 0H6"
                  />
                </svg>
              </button>
              <button
                id="add-pathway-btn"
                class="btn btn-sm btn-square join-item tooltip"
                data-tip="Add pathway (expand a station first)"
                disabled
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel -->
      <div
        id="right-panel"
        class="right-panel relative bg-base-200 border-l border-base-300 flex flex-col overflow-hidden min-h-0"
      >
        <div
          id="sheet-top-handle"
          class="md:hidden flex justify-center items-center py-2 cursor-grab active:cursor-grabbing flex-shrink-0"
        >
          <div class="w-10 h-1 rounded-full bg-base-content/20"></div>
        </div>
        <div
          id="panel-resizer"
          class="hidden md:block absolute left-0 top-0 bottom-0 w-2 cursor-col-resize z-10 group"
        >
          <div
            class="absolute inset-y-0 left-0.5 w-px bg-base-300 group-hover:bg-primary/50 transition-colors"
          ></div>
        </div>
        <!-- Browse Content -->
        <div class="flex-1 overflow-hidden h-full bg-base-100">
          <!-- Objects List View -->
          <div id="browse-list-view" class="h-full">
            <div id="browse-navigation" class="p-4 overflow-y-auto h-full">
              <div class="text-base-content/50 text-sm text-center py-8">
                No GTFS data to explore
              </div>
            </div>
          </div>

          <!-- Object Details View -->
          <div id="object-details-view" class="h-full hidden">
            <div class="h-full flex flex-col">
              <!-- Object Header with Breadcrumbs -->
              <div class="border-b border-base-300">
                <div id="object-breadcrumbs" class="p-3 bg-base-200">
                  <div class="breadcrumbs text-sm">
                    <ul id="breadcrumb-list">
                      <li>
                        <a id="breadcrumb-browse">
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            class="h-4 w-4 stroke-current"
                          >
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                            ></path>
                          </svg>
                        </a>
                      </li>
                    </ul>
                  </div>
                </div>
                <div class="flex items-center gap-2 p-4">
                  <span id="object-type" class="text-sm font-medium opacity-70"
                    >Agency</span
                  >
                  <span id="object-name" class="text-sm font-medium">None</span>
                </div>
              </div>

              <!-- Object Properties -->
              <div class="flex-1 overflow-y-auto">
                <div class="p-4">
                  <h3 class="text-sm font-semibold mb-3">Properties</h3>
                  <div id="object-properties" class="space-y-3">
                    <!-- Properties will be populated here -->
                  </div>
                </div>

                <!-- Related Objects -->
                <div class="border-t border-base-300 p-4">
                  <h3 class="text-sm font-semibold mb-3">Related Objects</h3>
                  <div id="related-browse" class="space-y-2">
                    <!-- Related objects will be populated here -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Files Modal -->
    <dialog id="files-modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl h-[90vh] flex flex-col p-0">
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between px-4 py-3 border-b border-base-300 flex-shrink-0"
        >
          <h3 class="text-base font-semibold">Files</h3>
          <button
            id="files-modal-close"
            class="btn btn-ghost btn-sm btn-square"
            onclick="document.getElementById('files-modal').close()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <!-- Modal Body -->
        <div class="flex-1 overflow-hidden min-h-0">
          <!-- File List View -->
          <div id="file-list-view" class="h-full">
            <div id="file-list" class="p-4 overflow-y-auto h-full"></div>
          </div>

          <!-- File Editor View -->
          <div id="file-editor-view" class="h-full hidden">
            <div class="h-full flex flex-col">
              <!-- Editor Header -->
              <div class="flex items-center gap-4 p-4 border-b border-base-300">
                <button id="back-to-files" class="btn btn-ghost btn-sm">
                  &lt;- Back to Files
                </button>
                <div class="flex items-center gap-2">
                  <span class="text-sm font-medium opacity-70">Editing:</span>
                  <span id="current-file-name" class="text-sm font-medium"
                    >None</span
                  >
                </div>
              </div>

              <!-- Editor Content -->
              <div class="flex-1 overflow-hidden">
                <div id="table-editor-view" class="h-full hidden">
                  <div id="table-container" class="h-full overflow-auto">
                    <div id="table-editor" class="h-full"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <!-- History Modal -->
    <dialog id="history-modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl max-h-[80vh] flex flex-col p-0">
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between px-4 py-3 border-b border-base-300 flex-shrink-0"
        >
          <h3 class="text-base font-semibold">History</h3>
          <button
            id="history-modal-close"
            class="btn btn-ghost btn-sm btn-square"
            onclick="document.getElementById('history-modal').close()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <!-- Modal Body -->
        <div class="overflow-y-auto flex-1">
          <div id="changes-panel"></div>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <!-- Hidden File Input -->
    <input type="file" id="file-input" accept=".zip" style="display: none" />

    <!-- Mobile Dock Navigation -->
    <nav
      id="mobile-dock"
      class="dock dock-sm md:hidden z-50 bg-base-200 border-t border-base-300 pb-[env(safe-area-inset-bottom)]"
    >
      <button id="dock-browse" class="dock-active" aria-label="Browse">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
          />
        </svg>
        <span class="dock-label">Browse</span>
      </button>
      <button id="dock-files" aria-label="Files">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"
          />
        </svg>
        <span class="dock-label">Files</span>
      </button>
      <button id="dock-changes" aria-label="History">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
          />
        </svg>
        <span class="dock-label">History</span>
      </button>
    </nav>

    <!-- Scripts -->
    <script type="module" src="./index.ts"></script>
  </body>
</html>
