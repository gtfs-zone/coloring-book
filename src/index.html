<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>edit.gtfs.zone - GTFS Transit Data Editor</title>
    <meta
      name="description"
      content="Browser-based GTFS transit data editor. Load, inspect and edit a GTFS feed on a map. Everything stays in your browser, with no server and no account."
    />
    <link rel="canonical" href="https://edit.gtfs.zone/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="gtfs.zone" />
    <meta property="og:url" content="https://edit.gtfs.zone/" />
    <meta
      property="og:title"
      content="edit.gtfs.zone - GTFS Transit Data Editor"
    />
    <meta
      property="og:description"
      content="Browser-based GTFS transit data editor. Load, inspect and edit a GTFS feed on a map. Everything stays in your browser, with no server and no account."
    />
    <meta property="og:image" content="https://edit.gtfs.zone/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="icons/favicon-512x512.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>

  <body class="font-sans h-screen overflow-hidden">
    <!-- App Container -->
    <div class="app-container h-screen grid grid-rows-[auto_1fr]">
      <!-- Header - DaisyUI Navbar -->
      <div class="navbar bg-base-100 col-span-2 border-b border-base-300">
        <div class="navbar-start">
          <a
            href="https://gtfs.zone"
            class="flex items-center gap-4"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="avatar">
              <div class="w-8 rounded-lg">
                <img src="logo.svg" alt="edit.gtfs.zone logo" />
              </div>
            </div>
            <div class="flex flex-col hidden md:flex">
              <h1 class="text-xl font-bold">
                <span class="text-primary">edit</span>.gtfs.zone<sup
                  id="app-version"
                  class="text-xs opacity-50 font-normal ml-1"
                ></sup>
              </h1>
            </div>
          </a>
        </div>

        <div class="navbar-end">
          <!-- Filled by renderNavbarActions from src/modules/navbar-actions.ts -->
          <div id="navbar-actions" class="flex items-center gap-2"></div>
        </div>
      </div>

      <!-- Map Container -->
      <div class="relative bg-base-300">
        <div id="map" class="w-full h-full"></div>

        <!-- Map Controls -->
        <div
          id="map-controls"
          class="absolute top-2 left-2 right-2 z-40 flex flex-row items-start gap-2"
        >
          <!-- Search -->
          <div
            id="map-search-card"
            class="relative flex-1 max-w-sm card card-bordered bg-base-100 shadow-lg p-2"
          >
            <input
              type="text"
              id="map-search"
              placeholder="Search"
              class="input input-sm w-full"
            />
          </div>

          <!-- Map Tools -->
          <div
            class="card card-bordered bg-base-100 shadow-lg p-1 flex-shrink-0"
          >
            <div class="join">
              <button
                id="pointer-btn"
                class="btn btn-sm btn-square join-item btn-primary tooltip"
                data-tip="Pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 2l12 10-6 1-3 6L6 2z"
                  />
                </svg>
              </button>
              <button
                id="add-stop-btn"
                class="btn btn-sm btn-square join-item tooltip"
                data-tip="Add stop"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 6v6m0 0v6m0-6h6m-6 0H6"
                  />
                </svg>
              </button>
              <div
                class="tooltip tooltip-bottom join-item"
                id="add-pathway-tooltip"
                data-tip="Add pathway (expand a station first)"
              >
                <button
                  id="add-pathway-btn"
                  class="btn btn-sm btn-square"
                  disabled
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <circle cx="13.5" cy="4.5" r="1.75" stroke-width="2" />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M14 7.5 11 12m0 0-2.5 8M11 12l4 4 .5 4m-2.7-10.8L8.5 10.5m4.7-2 3.8 2.5"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Auto-zoom toggle -->
          <div
            class="card card-bordered bg-base-100 shadow-lg p-1 flex-shrink-0"
          >
            <div
              id="auto-zoom-tooltip"
              class="tooltip tooltip-bottom"
              data-tip="Auto-zoom to selection"
            >
              <label
                id="auto-zoom-btn"
                class="swap btn btn-sm btn-square btn-primary"
              >
                <input type="checkbox" id="auto-zoom-toggle" checked />
                <svg
                  class="swap-on h-5 w-5"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"
                  />
                  <path
                    d="M12 17.5c1.9-2.4 2.9-4.2 2.9-5.6a2.9 2.9 0 1 0-5.8 0c0 1.4 1 3.2 2.9 5.6z"
                  />
                </svg>
                <svg
                  class="swap-off h-5 w-5"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"
                  />
                  <rect x="9" y="12.5" width="6" height="4.5" rx="1" />
                  <path d="M10.5 12.5v-1.5a1.5 1.5 0 0 1 3 0v1.5" />
                </svg>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel -->
      <div
        id="right-panel"
        class="right-panel relative bg-base-200 border-l border-base-300 flex flex-col overflow-hidden min-h-0"
      >
        <div
          id="sheet-top-handle"
          class="md:hidden flex justify-center items-center py-2 cursor-grab active:cursor-grabbing flex-shrink-0"
        >
          <div class="w-10 h-1 rounded-full bg-base-content/20"></div>
        </div>
        <div
          id="panel-resizer"
          class="hidden md:block absolute left-0 top-0 bottom-0 w-2 cursor-col-resize z-10 group"
        >
          <div
            class="absolute inset-y-0 left-0.5 w-px bg-base-300 group-hover:bg-primary/50 transition-colors"
          ></div>
        </div>
        <!-- Browse Content -->
        <div class="flex-1 overflow-hidden h-full bg-base-100">
          <!-- Objects List View -->
          <div id="browse-list-view" class="h-full">
            <div id="browse-navigation" class="p-4 overflow-y-auto h-full">
              <div class="text-base-content/50 text-sm text-center py-8">
                No GTFS data to explore
              </div>
            </div>
          </div>

          <!-- Object Details View -->
          <div id="object-details-view" class="h-full hidden">
            <div class="h-full flex flex-col">
              <!-- Object Header with Breadcrumbs -->
              <div class="border-b border-base-300">
                <div id="object-breadcrumbs" class="p-3 bg-base-200">
                  <div class="breadcrumbs text-sm">
                    <ul id="breadcrumb-list">
                      <li>
                        <a id="breadcrumb-browse">
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            class="h-4 w-4 stroke-current"
                          >
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                            ></path>
                          </svg>
                        </a>
                      </li>
                    </ul>
                  </div>
                </div>
                <div class="flex items-center gap-2 p-4">
                  <span id="object-type" class="text-sm font-medium opacity-70"
                    >Agency</span
                  >
                  <span id="object-name" class="text-sm font-medium">None</span>
                </div>
              </div>

              <!-- Object Properties -->
              <div class="flex-1 overflow-y-auto">
                <div class="p-4">
                  <h3 class="text-sm font-semibold mb-3">Properties</h3>
                  <div id="object-properties" class="space-y-3">
                    <!-- Properties will be populated here -->
                  </div>
                </div>

                <!-- Related Objects -->
                <div class="border-t border-base-300 p-4">
                  <h3 class="text-sm font-semibold mb-3">Related Objects</h3>
                  <div id="related-browse" class="space-y-2">
                    <!-- Related objects will be populated here -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Files Modal -->
    <dialog id="files-modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl h-[90vh] flex flex-col p-0">
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between px-4 py-3 border-b border-base-300 flex-shrink-0"
        >
          <h3 class="text-base font-semibold">Files</h3>
          <button
            id="files-modal-close"
            class="btn btn-ghost btn-sm btn-square"
            onclick="document.getElementById('files-modal').close()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <!-- Modal Body -->
        <div class="flex-1 overflow-hidden min-h-0">
          <!-- File List View -->
          <div id="file-list-view" class="h-full">
            <div id="file-list" class="p-4 overflow-y-auto h-full"></div>
          </div>

          <!-- File Editor View -->
          <div id="file-editor-view" class="h-full hidden">
            <div class="h-full flex flex-col">
              <!-- Editor Header -->
              <div class="flex items-center gap-4 p-4 border-b border-base-300">
                <button id="back-to-files" class="btn btn-ghost btn-sm">
                  &lt;- Back to Files
                </button>
                <div class="flex items-center gap-2">
                  <span class="text-sm font-medium opacity-70">Editing:</span>
                  <span id="current-file-name" class="text-sm font-medium"
                    >None</span
                  >
                </div>
              </div>

              <!-- Editor Content -->
              <div class="flex-1 overflow-hidden">
                <div id="table-editor-view" class="h-full hidden">
                  <div id="table-container" class="h-full overflow-auto">
                    <div id="table-editor" class="h-full"></div>
                  </div>
                </div>
                <!-- Raw text editor for non-spec passthrough files -->
                <div id="raw-editor-view" class="h-full hidden flex flex-col">
                  <div
                    class="px-4 py-2 text-xs opacity-70 border-b border-base-300"
                  >
                    Not part of the GTFS spec. Preserved verbatim on export.
                    Edits here are saved immediately and cannot be undone.
                  </div>
                  <textarea
                    id="raw-editor"
                    class="textarea textarea-bordered flex-1 m-4 font-mono text-xs leading-relaxed"
                    spellcheck="false"
                  ></textarea>
                  <div class="flex items-center gap-3 px-4 pb-4">
                    <button id="raw-editor-save" class="btn btn-primary btn-sm">
                      Save
                    </button>
                    <span
                      id="raw-editor-status"
                      class="text-xs opacity-70"
                    ></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <!-- History Modal -->
    <dialog id="history-modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl max-h-[80vh] flex flex-col p-0">
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between px-4 py-3 border-b border-base-300 flex-shrink-0"
        >
          <h3 class="text-base font-semibold">History</h3>
          <button
            id="history-modal-close"
            class="btn btn-ghost btn-sm btn-square"
            onclick="document.getElementById('history-modal').close()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <!-- Modal Body -->
        <div class="overflow-y-auto flex-1">
          <div id="changes-panel"></div>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>

    <!-- Hidden File Input -->
    <input type="file" id="file-input" accept=".zip" style="display: none" />

    <!-- Mobile Dock Navigation -->
    <nav
      id="mobile-dock"
      class="dock dock-sm md:hidden z-50 bg-base-200 border-t border-base-300 pb-[env(safe-area-inset-bottom)]"
    >
      <button id="dock-browse" class="dock-active" aria-label="Browse">
        <span class="dock-label">Browse</span>
      </button>
      <button id="dock-files" aria-label="Files">
        <span class="dock-label">Files</span>
      </button>
      <button id="dock-timetable" aria-label="Timetable">
        <span class="dock-label">Timetable</span>
      </button>
      <button id="dock-changes" aria-label="History">
        <span class="dock-label">History</span>
      </button>
    </nav>

    <!-- Scripts -->
    <script type="module" src="./index.ts"></script>
  </body>
</html>
